spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Enables Micrometer observation for @KafkaListener → extracts W3C
      # TraceContext from message headers and creates a child span linked to the
      # producer's trace, propagating the trace context across the Kafka boundary.
      observation-enabled: true
      # Retry after an auth exception instead of stopping the listener container.
      # Handles the window where kafka-init hasn't finished creating ACLs yet.
      auth-exception-retry-interval: 10s
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # JacksonJsonDeserializer is the Spring Kafka 4 Jackson 3-native class.
      # Jackson 3 supports java.time.Instant without any extra modules.
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ricsanfre.notification.kafka.OrderConfirmedEvent
    # SASL/SCRAM-SHA-512 authentication (applies to all consumers in this service).
    # KAFKA_USERNAME is non-sensitive — set in ConfigMap or use the default below.
    # KAFKA_PASSWORD must be injected from a Secret (K8s) or .env file (local dev).
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME:notification-service}"
        password="${KAFKA_PASSWORD:notification-service-secret}";

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: true

server:
  port: 8084

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    com.ricsanfre: INFO
