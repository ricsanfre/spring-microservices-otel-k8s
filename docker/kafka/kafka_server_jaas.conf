// Broker-side JAAS configuration for SCRAM-SHA-512.
//
// On the broker, ScramLoginModule acts as the server-side mechanism handler.
// Client credentials are NOT listed here — they are stored in Kafka's internal
// metadata log (KRaft) and managed via kafka-configs.sh.
//
// Referenced by: KAFKA_OPTS=-Djava.security.auth.login.config=<this-file>
KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
