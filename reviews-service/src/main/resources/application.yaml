spring:
  application:
    name: reviews-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/reviews}
    representation:
      uuid: standard

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/e-commerce/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/e-commerce
      # Client Credentials — used when calling user-service, product-service, order-service
      client:
        registration:
          user-service:
            client-id: reviews-service
            client-secret: ${REVIEWS_SERVICE_CLIENT_SECRET:reviews-service-secret}
            authorization-grant-type: client_credentials
            scope: users:resolve
          product-service:
            client-id: reviews-service
            client-secret: ${REVIEWS_SERVICE_CLIENT_SECRET:reviews-service-secret}
            authorization-grant-type: client_credentials
            scope: products:read
          order-service:
            client-id: reviews-service
            client-secret: ${REVIEWS_SERVICE_CLIENT_SECRET:reviews-service-secret}
            authorization-grant-type: client_credentials
            scope: orders:read
        provider:
          user-service:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/e-commerce/protocol/openid-connect/token
          product-service:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/e-commerce/protocol/openid-connect/token
          order-service:
            token-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/e-commerce/protocol/openid-connect/token

  # HTTP service client groups — base URLs for @ImportHttpServices proxies
  http:
    serviceclient:
      user-service:
        base-url: ${USER_SERVICE_URL:http://localhost:8085}
      product-service:
        base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
      order-service:
        base-url: ${ORDER_SERVICE_URL:http://localhost:8082}

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: true

# Resilience4j — circuit breaker for user-service calls
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    instances:
      user-service:
        timeout-duration: 3s

# Per ADR-004: Caffeine TTL for sub → internal userId cache
reviews:
  user-resolver:
    cache-ttl-minutes: 10

server:
  port: 8083

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    mongodb:
      enabled: true               # MongoDB command-level spans in Tempo
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ricsanfre: INFO
