openapi: 3.1.0
info:
  title: Reviews Service API
  description: Product reviews — MongoDB · validated via order-service + product-service · port 8083
  version: "1.0.0"

servers:
  - url: /api/v1

tags:
  - name: Reviews
    description: Product review operations

paths:

  /reviews/product/{productId}:
    get:
      tags: [Reviews]
      operationId: getReviewsByProduct
      summary: Get all reviews for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reviews for the product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'
        "401":
          description: Unauthorized

  /reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Create a product review
      description: |
        Creates a review for a product. Requires that the authenticated user has a
        DELIVERED order containing the specified product. The user's internal ID is
        resolved from the JWT sub claim via user-service (lazy resolution per ADR-004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Product or order not found
        "409":
          description: Business rule violation (no delivered order with this product, or duplicate review)

  /reviews/{id}:
    delete:
      tags: [Reviews]
      operationId: deleteReview
      summary: Delete a review (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Review deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not the review owner
        "404":
          description: Review not found

components:
  schemas:

    ReviewResponse:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId as hex string
        productId:
          type: string
        orderId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReviewRequest:
      type: object
      required:
        - productId
        - orderId
        - rating
      properties:
        productId:
          type: string
          description: MongoDB ObjectId of the product being reviewed
        orderId:
          type: string
          format: uuid
          description: UUID of the confirmed, delivered order containing the product
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Rating from 1 (worst) to 5 (best)
        comment:
          type: string
          description: Optional review text
