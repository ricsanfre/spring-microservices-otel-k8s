# Staging overlay for cart-service
# Patches the base resources with staging-specific image tags and configuration.
#
# Build & apply:
#   kustomize build k8s/apps/cart-service/overlays/staging | kubectl apply -f -
# or:
#   kubectl apply -k k8s/apps/cart-service/overlays/staging
#
# Kafka SCRAM secret — copy from the Strimzi-generated Secret in the kafka namespace:
#   kubectl get secret cart-service -n kafka -o json \
#     | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.ownerReferences)
#            | .metadata.name = "cart-service-kafka-secret"
#            | .metadata.namespace = "e-commerce"' \
#     | kubectl apply -f -
resources:
  - ../../base

# Staging-specific patches
patches:
  # Scale to 1 replica on laptop (saves resources)
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: cart-service

  # Overwrite imagePullPolicy to Always so ghcr.io is re-checked on each restart
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: cart-service
