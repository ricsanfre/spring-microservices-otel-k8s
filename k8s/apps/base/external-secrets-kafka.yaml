# ExternalSecrets — kafka namespace
# Consumed by: Strimzi User Operator (KafkaUser spec.authentication.password.valueFrom)
#
# Secrets created (in the kafka namespace):
#   cart-service-kafka-password          ← SCRAM bootstrap password for cart-service KafkaUser
#   order-service-kafka-password         ← SCRAM bootstrap password for order-service KafkaUser
#   notification-service-kafka-password  ← SCRAM bootstrap password for notification-service KafkaUser
#
# The Strimzi User Operator reads each secret and programs the Kafka broker's
# SCRAM-SHA-512 credentials for the corresponding KafkaUser.  The same password
# values are re-used in the e-commerce namespace (see external-secrets-ecommerce.yaml)
# so Spring Boot services can authenticate with the broker.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-service-kafka-password
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: cart-service-kafka-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /kafka/cart-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-kafka-password
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: order-service-kafka-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /kafka/order-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-service-kafka-password
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: notification-service-kafka-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /kafka/notification-service
