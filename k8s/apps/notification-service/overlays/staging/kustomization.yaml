# Staging overlay for notification-service
#
# Build & apply:
#   kubectl apply -k k8s/apps/notification-service/overlays/staging
resources:
  - ../../base

images:
  - name: localhost:5000/notification-service
    newTag: "latest"

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: notification-service

  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
      name: notification-service
