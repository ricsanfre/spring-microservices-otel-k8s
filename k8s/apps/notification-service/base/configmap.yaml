---
# Non-sensitive configuration for notification-service.
# Kafka consumer — no outbound HTTP calls, no OAuth2 client credentials needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: e-commerce
data:
  SERVER_PORT: "8084"
  # Kafka (Strimzi cluster bootstrap)
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  # OpenTelemetry Collector
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "notification-service"
