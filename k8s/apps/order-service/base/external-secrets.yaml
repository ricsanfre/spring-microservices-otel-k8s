# ExternalSecrets — order-service (e-commerce namespace)
# Provisions: order-service-db-secret, order-service-oauth-secret, order-service-kafka-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-db-secret
  namespace: e-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: order-service-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /postgres/orders-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-oauth-secret
  namespace: e-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: order-service-oauth-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /ecommerce/order-service-oauth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-kafka-secret
  namespace: e-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: order-service-kafka-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /kafka/order-service
