apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Envoy Gateway — GatewayClass, Gateway, HTTPRoutes
# SecurityPolicy removed: microservices are no longer exposed externally.
# JWT enforcement lives inside each Spring Boot service (OAuth2 Resource Server).
resources:
  - gateway-class.yaml
  - gateway.yaml
  - httproutes.yaml
