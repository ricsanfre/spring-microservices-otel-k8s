apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PostgreSQL — CNPG Cluster + per-service Database CRs + ExternalSecrets
# Namespace: postgres
#
# Prerequisites: ESO operator + ClusterSecretStore must be installed first
# (make k8s-eso-helm && kubectl apply -k k8s/infra/eso)
resources:
  - cluster.yaml
  - databases.yaml
  - external-secrets.yaml
