apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PostgreSQL — CNPG Cluster + ExternalSecrets
# Namespace: postgres
#
# App-domain resources (per-service Database CRs) live in:
#   k8s/apps/base/databases.yaml
#
# Prerequisites: ESO operator + ClusterSecretStore must be installed first
# (make k8s-eso-helm && kubectl apply -k k8s/infra/eso)
resources:
  - cluster.yaml
  - external-secrets.yaml
