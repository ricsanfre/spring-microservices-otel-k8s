# ExternalSecrets — postgres namespace
# Consumed by: CloudNativePG Cluster CR (bootstrap secret + managed roles)
#
# Secrets created:
#   postgres-superuser-secret  ← CNPG bootstrap admin account
#   users-db-secret            ← users_owner role (user-service DB)
#   orders-db-secret           ← orders_owner role (order-service DB)
#   keycloak-db-secret         ← keycloak_owner role (Keycloak DB)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser-secret
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: postgres-superuser-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /postgres/superuser
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: users-db-secret
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: users-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /postgres/users-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db-secret
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: orders-db-secret
    creationPolicy: Owner
