apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# monitoring — ExternalSecrets for the monitoring namespace
# Namespace: monitoring
#
# Provisions secrets consumed by the kube-prometheus-stack Helm release
# (Grafana admin credentials).  Apply before k8s-infra-monitoring.
#
# Apply:
#   kubectl apply -k k8s/infra/monitoring
namespace: monitoring
resources:
  - external-secrets.yaml
