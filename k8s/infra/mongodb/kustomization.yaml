# MongoDB — MongoDBCommunity replica set + per-service credentials + ExternalSecrets
# Namespace: mongodb
#
# Prerequisites: ESO operator + ClusterSecretStore must be installed first
# (make k8s-eso-helm && kubectl apply -k k8s/infra/eso)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mongodb
resources:
  - community.yaml
  - external-secrets.yaml
