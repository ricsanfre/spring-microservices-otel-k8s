# MongoDB Community Operator — MongoDBCommunity CR
# Single replica set with two databases (one per service).
# Namespace: mongodb
#
# Prerequisites: credential secrets are created by ESO ExternalSecrets
# (k8s/infra/eso/external-secrets-mongodb.yaml) — apply k8s/infra/eso first.
#
# Apply:
#   kubectl apply -f k8s/infra/mongodb/community.yaml
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
  namespace: mongodb
spec:
  members: 1        # single-node replica set — sufficient for laptop staging
  type: ReplicaSet
  version: "8.0.4"

  security:
    authentication:
      modes:
        - SCRAM

  users:
    # ── product-service ───────────────────────────────────────────────────
    - name: products_owner
      db: admin
      passwordSecretRef:
        name: mongodb-products-secret
      roles:
        - name: readWrite
          db: products
      scramCredentialsSecretName: products-scram
    # ── reviews-service ───────────────────────────────────────────────────
    - name: reviews_owner
      db: admin
      passwordSecretRef:
        name: mongodb-reviews-secret
      roles:
        - name: readWrite
          db: reviews
      scramCredentialsSecretName: reviews-scram
    # ── notification-service ──────────────────────────────────────────────
    - name: notifications_owner
      db: admin
      passwordSecretRef:
        name: mongodb-notifications-secret
      roles:
        - name: readWrite
          db: notifications
      scramCredentialsSecretName: notifications-scram

  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: snappy
