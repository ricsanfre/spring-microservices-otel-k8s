apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kafka — Strimzi Kafka cluster + KafkaTopic + KafkaUser CRs + ExternalSecrets
# Namespace: kafka
#
# Prerequisites: ESO operator + ClusterSecretStore must be installed first
# so that *-kafka-password secrets exist before KafkaUser CRs are applied.
resources:
  - cluster.yaml
  - topics.yaml
  - users.yaml
  - external-secrets.yaml
