# Envoy Gateway — HTTPRoute for Keycloak
# Routes keycloak.local.test to the Keycloak service in the keycloak namespace.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "keycloak.local.test"
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
