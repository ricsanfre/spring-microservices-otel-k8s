# Keycloak — Keycloak CR + KeycloakRealmImport CR + ExternalSecrets
# Namespace: keycloak
# Operator must already be installed (make k8s-keycloak-operator)
#
# Prerequisites: ESO operator + ClusterSecretStore must be installed first
# (make k8s-eso-helm && kubectl apply -k k8s/infra/eso)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - keycloak.yaml
  - realm-import.yaml
  - httproute.yaml
  - external-secrets.yaml
