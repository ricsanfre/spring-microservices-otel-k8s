# Keycloak — Keycloak CR + database + ExternalSecrets
# Resources span two namespaces (keycloak, postgres) so no global namespace is
# set here — each resource carries its own metadata.namespace.
# Operator must already be installed (make k8s-keycloak-operator)
#
# Realm configuration (clients, roles, scopes, users) lives in:
#   k8s/apps/base/realm-import.yaml
#
# Prerequisites: ESO operator + ClusterSecretStore must be installed first
# (make k8s-eso-helm && kubectl apply -k k8s/infra/eso)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keycloak.yaml
  - httproute.yaml
  - external-secrets.yaml
  - database.yaml
