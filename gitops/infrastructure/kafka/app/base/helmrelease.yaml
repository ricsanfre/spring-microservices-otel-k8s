apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
  namespace: kafka
spec:
  interval: 1h
  # OCIRepository must be referenced via chartRef, not spec.chart.spec.sourceRef
  chartRef:
    kind: OCIRepository
    name: strimzi
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Watch all namespaces so KafkaTopic/KafkaUser CRs can live in any namespace
    # (e.g. e-commerce namespace via gitops/apps/core-config)
    watchAnyNamespace: true
    replicas: 1
