# Strimzi — Kafka Cluster CR
# Single-node KRaft cluster (no ZooKeeper) — suitable for laptop staging.
# Namespace: kafka
#
# Apply:
#   kubectl apply -f k8s/infra/kafka/cluster.yaml
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-pool
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  storage:
    type: ephemeral # ephemeral is fine for laptop staging
  roles:
    - broker
    - controller
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
  annotations:
    # Use KRaft mode (ZooKeeper-free) — requires Strimzi 0.39+
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV0
    listeners:
      # TLS listener — used by the Strimzi Entity Operator for internal admin access.
      # Keep even if app services use the scram listener.
      - name: tls
        port: 9093
        type: internal
        tls: true
      # SASL/SCRAM-SHA-512 listener — all microservice connections must authenticate.
      # Bootstrap: kafka-kafka-bootstrap.kafka.svc.cluster.local:9095
      - name: scram
        port: 9095
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    authorization:
      # SimpleAclAuthorizer (backed by StandardAuthorizer in KRaft mode).
      # Deny by default — every service must have explicit KafkaUser ACLs.
      type: simple
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1

  entityOperator:
    topicOperator: {}
    userOperator: {}
