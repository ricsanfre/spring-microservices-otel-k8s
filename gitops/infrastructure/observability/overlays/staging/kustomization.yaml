apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# observability staging overlay — Grafana admin ExternalSecret + OTel Collector.
# kube-prometheus-stack and OTel Operator must be installed before applying.
# ESO ClusterSecretStore must be ready so ExternalSecrets can sync.
#
# Apply:
#   kubectl apply -k gitops/infrastructure/observability/overlays/staging
namespace: monitoring
resources:
  - ../../base
  - monitoring-externalsecrets.yaml
  - collector.yaml
