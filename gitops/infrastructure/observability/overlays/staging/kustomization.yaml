apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# observability staging overlay — Grafana admin ExternalSecret + OTel Collector.
# Combines the operators (../../base) with the staging CRs (../../config/staging).
# Use this overlay for a full local apply:
#   kubectl apply -k gitops/infrastructure/observability/overlays/staging
# Flux uses base/ (via infra-operators) and config/staging/ (via infra-monitoring) separately.
namespace: monitoring
resources:
  - ../../base
  - ../../config/staging
