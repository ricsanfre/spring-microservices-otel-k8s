# ExternalSecrets — monitoring namespace
# Consumed by: kube-prometheus-stack (Grafana admin credentials)
#
# Secrets created:
#   grafana-admin-secret  ← keys: admin-user, admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /monitoring/grafana
