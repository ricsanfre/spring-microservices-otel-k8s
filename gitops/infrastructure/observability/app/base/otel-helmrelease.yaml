apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-operator
      # TODO: pin to a specific version once the desired chart version is confirmed
      version: ">=0.60.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    admissionWebhooks:
      certManager:
        enabled: true
        # Reuse the existing cluster CA issuer (created by cert-manager infra component)
        issuerRef:
          kind: ClusterIssuer
          name: local-test-ca-issuer
