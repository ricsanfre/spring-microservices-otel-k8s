apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: loki
      # TODO: pin to a specific version once the desired chart version is confirmed
      version: ">=6.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      limits_config:
        allow_structured_metadata: true
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    singleBinary:
      replicas: 1
    minio:
      enabled: false
    gateway:
      enabled: false
    # Disable read/write/backend split — SingleBinary handles everything
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Disable canary and helm tests — write/read path validation not needed for staging
    lokiCanary:
      enabled: false

    test:
      enabled: false

    # Disable memcached caches — filesystem storage, no distributed caching needed
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false