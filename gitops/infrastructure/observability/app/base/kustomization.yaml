apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# observability base — HelmRepositories + HelmReleases for the full observability
# stack, managed by the Flux Helm controller:
#   - kube-prometheus-stack (Prometheus + Grafana)
#   - OpenTelemetry Operator
#   - Grafana Tempo (monolithic)
#   - Grafana Loki (SingleBinary)
# The *-values.yaml files in this directory are superseded by spec.values in
# their respective helmrelease.yaml files.
resources:
  - namespace.yaml
  - monitoring-external-secrets.yaml
  - prometheus-helmrepository.yaml
  - prometheus-helmrelease.yaml
  - otel-helmrepository.yaml
  - otel-helmrelease.yaml
  - grafana-helmrepository.yaml
  - tempo-helmrelease.yaml
  - loki-helmrelease.yaml
