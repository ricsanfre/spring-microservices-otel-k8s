# OpenTelemetry Collector — central OTLP fan-out
#
# Receives OTLP signals from all Spring Boot services and routes them to:
#   Traces  → Tempo monolithic  (grafana/tempo Helm release)
#   Logs    → Loki monolithic   (grafana/loki Helm release)
#   Metrics → Prometheus        (kube-prometheus-stack Helm release)
#
# Service endpoints visible to Spring Boot apps inside the cluster:
#   OTLP gRPC  → otel-collector.monitoring.svc.cluster.local:4317
#   OTLP HTTP  → otel-collector.monitoring.svc.cluster.local:4318
#
# Required:
#   - opentelemetry-operator installed (make k8s-otel-operator-helm)
#   - Observability stack deployed    (make k8s-infra-monitoring)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
spec:
  mode: deployment
  replicas: 1

  # Use the contrib distribution — required for the loki exporter
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  config:
    # ── Receivers ────────────────────────────────────────────────────────────
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    # ── Processors ───────────────────────────────────────────────────────────
    processors:
      # Back-pressure guard — drop data rather than OOM the pod
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      # Batch before exporting — reduces downstream request count
      batch:
        send_batch_size: 2000
        timeout: 2s

      # Enrich every signal with the deployment environment
      resource/staging:
        attributes:
          - action: insert
            key: deployment.environment
            value: staging

      # Loki is optimized for high-cardinality labels, but these must be Resource attributes, not Log attributes. This processor safely transforms the relevant Kubernetes attributes for Loki without risking data loss from null errors. By moving the namespace and other k8s metadata to the Resource level, you enable Loki to index them as stream labels, which drastically improves query performance in Grafana. 
      # Transform the log attributes to Loki resource labels safely
      # loki create index for resource attributes, so need to move k8s attributes from log to resource
      transform/loki:
        error_mode: ignore # Prevent a corrupt log from stopping the pipeline
        log_statements:
          - context: log
            statements:
              # Add a fixed source label
              - set(resource.attributes["exporter"], "OTLP")
              # Move k8s.namespace.name to the resource ONLY if it exists in the log to avoid null errors
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - delete_key(attributes, "k8s.namespace.name") where attributes["k8s.namespace.name"] != nil


    # ── Exporters ────────────────────────────────────────────────────────────
    exporters:
      # Traces → Tempo monolithic (grafana/tempo Helm release)
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # Logs → Loki monolithic (grafana/loki Helm release, gateway disabled)
      # NOTE: Exporter `loki` is deprecated fom release 0.153.0
      otlphttp/loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp

      # Metrics → Prometheus OTLP receiver (kube-prometheus-stack Helm release)
      otlphttp/prometheus:
        endpoint: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp

    # ── Pipelines ────────────────────────────────────────────────────────────
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource/staging]
          exporters: [otlp/tempo]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource/staging, transform/loki]
          exporters: [otlphttp/loki]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource/staging]
          exporters: [otlphttp/prometheus]
