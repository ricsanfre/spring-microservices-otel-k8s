---
# Valkey — single-instance Deployment
# Namespace: valkey  (created by k8s/namespaces.yaml)
#
# Valkey is Redis-compatible; cart-service uses the Spring Data Redis client.
# RDB persistence is enabled (save 60 1) so the cart survives Pod restarts
# within a staging session. Data is lost when the PVC is deleted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: e-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: e-commerce
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine
          # Entrypoint script generates ACL file from env vars then starts the server.
          command: ["/bin/sh", "/scripts/valkey-entrypoint.sh"]
          env:
            - name: CART_SERVICE_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-passwords
                  key: CART_SERVICE_VALKEY_PASSWORD
            - name: VALKEY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-passwords
                  key: VALKEY_ADMIN_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
          livenessProbe:
            exec:
              # health user: nopass, +ping only — no secret needed in the probe command.
              command: ["valkey-cli", "--user", "health", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "--user", "health", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}   # stateless for staging; swap for PVC in production
        - name: scripts
          configMap:
            name: valkey-scripts
