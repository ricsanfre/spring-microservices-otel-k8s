# ExternalSecrets — Valkey (valkey namespace)
# Provisions: valkey-passwords Secret containing per-service ACL passwords.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-passwords
  namespace: valkey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: valkey-passwords
    creationPolicy: Owner
  data:
    - secretKey: CART_SERVICE_VALKEY_PASSWORD
      remoteRef:
        key: /valkey/cart-service
        property: password
    - secretKey: VALKEY_ADMIN_PASSWORD
      remoteRef:
        key: /valkey/admin
        property: password
