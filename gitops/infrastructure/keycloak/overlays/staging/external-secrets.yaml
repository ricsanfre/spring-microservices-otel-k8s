# ExternalSecrets — keycloak namespace
# Consumed by: Keycloak Operator Keycloak CR (bootstrapAdmin + db credentials)
#              KeycloakRealmImport CR (spec.placeholders → client secrets + user passwords)
#
# Secrets created:
#   keycloak-admin-secret   ← bootstrap admin account (spec.bootstrapAdmin.user)
#   keycloak-db-secret      ← PostgreSQL credentials for the keycloak database
#   keycloak-realm-secrets  ← all placeholders for KeycloakRealmImport
#
# Note: keycloak-db-secret reuses the /postgres/keycloak-db store key so the
# password is always consistent with the CNPG-managed role in the postgres ns.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /keycloak/admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: keycloak-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /postgres/keycloak-db
---
# Provides all placeholder values for KeycloakRealmImport spec.placeholders.
# Must be in the same namespace as the Keycloak CR (keycloak).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: keycloak-realm-secrets
    creationPolicy: Owner
  data:
    # Client secrets
    - secretKey: KC_CLIENT_ECOMMERCE_WEB
      remoteRef:
        key: /keycloak/clients
        property: e-commerce-web
    - secretKey: KC_CLIENT_CART_SERVICE
      remoteRef:
        key: /keycloak/clients
        property: cart-service
    - secretKey: KC_CLIENT_ORDER_SERVICE
      remoteRef:
        key: /keycloak/clients
        property: order-service
    - secretKey: KC_CLIENT_REVIEWS_SERVICE
      remoteRef:
        key: /keycloak/clients
        property: reviews-service
    - secretKey: KC_CLIENT_PRODUCT_SERVICE
      remoteRef:
        key: /keycloak/clients
        property: product-service
    - secretKey: KC_CLIENT_USER_SERVICE
      remoteRef:
        key: /keycloak/clients
        property: user-service
    - secretKey: KC_CLIENT_NOTIFICATION_SERVICE
      remoteRef:
        key: /keycloak/clients
        property: notification-service
    # User passwords
    - secretKey: KC_USER_TESTUSER_PASSWORD
      remoteRef:
        key: /keycloak/users
        property: testuser-password
    - secretKey: KC_USER_OTHERUSER_PASSWORD
      remoteRef:
        key: /keycloak/users
        property: otheruser-password
    - secretKey: KC_USER_ADMINUSER_PASSWORD
      remoteRef:
        key: /keycloak/users
        property: adminuser-password
