apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# keycloak staging overlay — Keycloak CR + database + HTTPRoute + ExternalSecrets.
# Combines the operator (../../base) with the staging CRs (../../config/staging).
# Use this overlay for a full local apply:
#   kubectl apply -k gitops/infrastructure/keycloak/overlays/staging
# Flux uses base/ (via infra-operators) and config/staging/ (via infra-backends) separately.
resources:
  - ../../base
  - ../../config/staging
