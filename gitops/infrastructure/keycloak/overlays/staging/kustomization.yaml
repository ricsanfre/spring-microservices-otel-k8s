apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# keycloak staging overlay — Keycloak CR + database + HTTPRoute + ExternalSecrets.
# Keycloak Operator must be installed (make k8s-keycloak-operator) before applying.
# ESO ClusterSecretStore must be ready so ExternalSecrets can sync.
#
# Apply:
#   kubectl apply -k gitops/infrastructure/keycloak/overlays/staging
resources:
  - ../../base
  - keycloak.yaml
  - database.yaml
  - httproute.yaml
  - external-secrets.yaml
