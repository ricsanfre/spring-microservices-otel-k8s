# Keycloak Operator — Keycloak CR
# Namespace: keycloak
#
# Prerequisites — create secrets before applying:
#   kubectl create secret generic keycloak-secret \
#     --from-literal=username=admin --from-literal=password=<CHANGE_ME> \
#     --namespace keycloak
#   kubectl create secret generic keycloak-db-secret \
#     --from-literal=username=keycloak_owner --from-literal=password=<CHANGE_ME> \
#     --namespace keycloak
#
# Apply:
#   kubectl apply -k k8s/infra/keycloak
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1          # single instance for laptop staging

  # HTTP only — Envoy Gateway terminates TLS externally; Istio handles mTLS internally
  http:
    httpEnabled: true

  # External URL embedded in tokens (issuer claim, OIDC discovery)
  # strict: false        — accept requests on any hostname (internal cluster DNS + external via Envoy)
  # backchannelDynamic   — derive backchannel base URL from the incoming request, so internal
  #                        microservices calling http://keycloak-service.keycloak.svc.cluster.local:8080
  #                        get correct backchannel URLs without going through Envoy Gateway
  hostname:
    hostname: https://keycloak.${CLUSTER_DOMAIN}
    strict: true
    backchannelDynamic: true

  proxy:
    headers: xforwarded

  db:
    vendor: postgres
    host: postgres-rw.databases.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  # Bootstrap admin account (only used on first start; ignored once realm is initialised)
  bootstrapAdmin:
    user:
      secret: keycloak-admin-secret

  additionalOptions:
      # OpenTelemetry configuration for Keycloak metrics and tracing
      # Endpoint global para el colector OTel
    - name: telemetry-endpoint
      value: "http://otel-collector.monitoring.svc.cluster.local"
      # Service name to identify Keycloak in the OpenTelemetry Collector and backend (e.g. for metrics aggregation and tracing service maps)
    - name: telemetry-service-name
      value: "keycloak"
     # Specify the protocol for telemetry export (default is grpc, but can be set to http/protobuf if your collector does not support gRPC)
     # - name: telemetry-protocol
     #   value: "grpc"
      # Enable metrics
    - name: tracing-enabled
      value: "true"
      # Specify the sampling ratio for tracing (1.0 = 100% of requests)
    - name: tracing-sampler-ratio
      value: "1.0"
    - name: metrics-enabled
      value: "true"
      # Enable cache metrics histograms
    - name: cache-metrics-histograms-enabled
      value: "true"
      # Enable HTTP metrics histograms
    - name: http-metrics-histograms-enabled
      value: "true"
      # Enable event metrics for users
    - name: event-metrics-user-enabled
      value: "true"
      # Enable health endpoint at /health (disabled by default since it adds some overhead; enable when using OpenTelemetry Collector or Kubernetes health checks)
    - name: health-enabled
      value: "true"
