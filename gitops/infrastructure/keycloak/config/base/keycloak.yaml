# Keycloak Operator — Keycloak CR
# Namespace: keycloak
#
# Prerequisites — create secrets before applying:
#   kubectl create secret generic keycloak-secret \
#     --from-literal=username=admin --from-literal=password=<CHANGE_ME> \
#     --namespace keycloak
#   kubectl create secret generic keycloak-db-secret \
#     --from-literal=username=keycloak_owner --from-literal=password=<CHANGE_ME> \
#     --namespace keycloak
#
# Apply:
#   kubectl apply -k k8s/infra/keycloak
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1          # single instance for laptop staging

  # HTTP only — Envoy Gateway terminates TLS externally; Istio handles mTLS internally
  http:
    httpEnabled: true

  # External URL embedded in tokens (issuer claim, OIDC discovery)
  # strict: false        — accept requests on any hostname (internal cluster DNS + external via Envoy)
  # backchannelDynamic   — derive backchannel base URL from the incoming request, so internal
  #                        microservices calling http://keycloak-service.keycloak.svc.cluster.local:8080
  #                        get correct backchannel URLs without going through Envoy Gateway
  hostname:
    hostname: https://keycloak.${CLUSTER_DOMAIN}
    strict: false
    backchannelDynamic: true

  proxy:
    headers: xforwarded

  db:
    vendor: postgres
    host: postgres-rw.databases.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  # Bootstrap admin account (only used on first start; ignored once realm is initialised)
  bootstrapAdmin:
    user:
      secret: keycloak-admin-secret

  startOptimized: false
  additionalOptions:

    # Enable OpenTelemetry features (requires Keycloak 21+ and features=opentelemetry):
    - name: metrics-enabled
      value: "true"

    # Open Telemetry metrics is experimental feauture. Not fully supported by Quarkus yet
    # See: https://github.com/keycloak/keycloak/issues/45159
    # Enabling features using required API version syntax (since Keycloak 21+):
    - name: features
      value: "opentelemetry,opentelemetry-logs"
    #  value: "opentelemetry,opentelemetry-logs,opentelemetry-metrics" # Enable metrics when it becomes stable in future releases

    # OTEL endpoint
    - name: telemetry-endpoint
      value: "http://otel-collector.monitoring.svc.cluster.local:4317"
    - name: telemetry-protocol
      value: "grpc"

    # Enable OpenTelemetry metrics (requires telemetry-endpoint and features=opentelemetry-metrics)
    # - name: telemetry-metrics-enabled
    #   value: "true"
    # - name: telemetry-metrics-interval
    #   value: "30s"

    # Enable OpenTelemetry tracing (requires telemetry-endpoint and features=opentelemetry)
    - name: telemetry-tracing-enabled
      value: "true"

    # Enable OpenTelemetry logs (requires telemetry-endpoint and features=opentelemetry-logs)
    - name: telemetry-logs-enabled
      value: "true"
    - name: telemetry-logs-level
      value: "INFO"

    # Enable health endpoint at /health (disabled by default since it adds some overhead; enable when using OpenTelemetry Collector or Kubernetes health checks)
    - name: health-enabled
      value: "true"
