apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# databases staging overlay — CNPG Cluster (2-node) + MongoDB Community (1-node).
# CNPG and MongoDB Community operators must be installed before applying.
# ESO ClusterSecretStore must be ready so ExternalSecrets can sync.
#
# Apply:
#   kubectl apply -k gitops/infrastructure/databases/overlays/staging
resources:
  - ../../base
  - postgres-cluster.yaml
  - postgres-externalsecrets.yaml
  - mongodb-community.yaml
  - mongodb-externalsecrets.yaml
