# ExternalSecrets — mongodb namespace
# Consumed by: MongoDB Community Operator (spec.users[].passwordSecretRef)
#
# Secrets created:
#   mongodb-admin-secret           ← DBA / direct admin access
#   mongodb-products-secret        ← products_owner user password
#   mongodb-reviews-secret         ← reviews_owner user password
#   mongodb-notifications-secret   ← notifications_owner user password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-admin-secret
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: mongodb-admin-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /mongodb/admin
---
