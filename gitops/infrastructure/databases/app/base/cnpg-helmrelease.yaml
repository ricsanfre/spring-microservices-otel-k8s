apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      # TODO: pin to a specific version once the desired chart version is confirmed
      version: ">=0.20.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    monitoring:
      podMonitorEnabled: false
