apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ESO config base — CRs that require External Secrets Operator CRDs.
# Included by environment overlays (config/staging, config/production).
# NOTE: cluster-secret-store.yaml uses inline credentials suitable for staging only.
# Production should patch this with a real provider (e.g., AWS Secrets Manager).
resources:
  - cluster-secret-store.yaml
