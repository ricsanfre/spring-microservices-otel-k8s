# External Secrets Operator — ClusterSecretStore (Fake provider)
#
# The Fake provider stores all secret data INLINE in this manifest.
# Suitable for local laptop staging only — do NOT use in production.
#
# IMPORTANT: Replace every "changeme" value with real credentials before
# deploying to a shared or persistent environment.  For a single-developer
# laptop cluster the defaults are sufficient to bootstrap the stack.
#
# Key path convention:
#   /postgres/<role>         — PostgreSQL credentials
#   /keycloak/<resource>     — Keycloak admin / bootstrap credentials
#   /mongodb/<user>          — MongoDB user passwords
#   /kafka/<service>         — Kafka SCRAM-SHA-512 passwords (Strimzi bootstrap)
#   /monitoring/<component>  — observability stack credentials
#   /ecommerce/<service>     — application OAuth2 / misc credentials
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-store
spec:
  provider:
    fake:
      data:

        # ── PostgreSQL ─────────────────────────────────────────────────────────
        - key: /postgres/superuser
          value: '{"username": "postgres", "password": "changeme"}'

        - key: /postgres/users-db
          value: '{"username": "users_owner", "password": "changeme"}'

        - key: /postgres/orders-db
          value: '{"username": "orders_owner", "password": "changeme"}'

        - key: /postgres/keycloak-db
          value: '{"username": "keycloak_owner", "password": "changeme"}'

        # ── Keycloak ───────────────────────────────────────────────────────────
        - key: /keycloak/admin
          value: '{"username": "admin", "password": "changeme"}'

        # Client secrets — injected into KeycloakRealmImport via spec.placeholders
        - key: /keycloak/clients
          value: '{"e-commerce-web": "e-commerce-web-secret", "cart-service": "cart-service-secret", "order-service": "order-service-secret", "reviews-service": "reviews-service-secret", "product-service": "product-service-secret", "user-service": "user-service-secret", "notification-service": "notification-service-secret"}'

        # Test user passwords — injected into KeycloakRealmImport via spec.placeholders
        - key: /keycloak/users
          value: '{"testuser-password": "changeme", "otheruser-password": "changeme", "adminuser-password": "changeme"}'

        # ── MongoDB ────────────────────────────────────────────────────────────
        # The admin secret is kept for DBA access; not referenced by operator CRs.
        - key: /mongodb/admin
          value: '{"password": "changeme"}'

        - key: /mongodb/products
          value: '{"password": "changeme"}'

        - key: /mongodb/reviews
          value: '{"password": "changeme"}'

        - key: /mongodb/notifications
          value: '{"password": "changeme"}'

        # ── Kafka SCRAM bootstrap passwords ────────────────────────────────────
        # Strimzi KafkaUser CRs reference these secrets via
        # spec.authentication.password.valueFrom.secretKeyRef.
        # Strimzi reads the value and programs the broker's SCRAM credentials;
        # the same password is also synced to the e-commerce namespace so the
        # Spring Boot apps can authenticate.
        - key: /kafka/cart-service
          value: '{"password": "changeme"}'

        - key: /kafka/order-service
          value: '{"password": "changeme"}'

        - key: /kafka/notification-service
          value: '{"password": "changeme"}'

        # ── Valkey ─────────────────────────────────────────────────────────────
        - key: /valkey/cart-service
          value: '{"password": "changeme"}'

        - key: /valkey/admin
          value: '{"password": "changeme"}'

        # ── Monitoring ─────────────────────────────────────────────────────────
        - key: /monitoring/grafana
          value: '{"admin-user": "admin", "admin-password": "changeme"}'

        # ── e-commerce application secrets ─────────────────────────────────────
        # Auth.js session signing key (must be a random base64 string ≥ 32 bytes)
        # Generate: openssl rand -base64 32
        - key: /ecommerce/frontend-service
          value: '{"AUTH_SECRET": "changeme-replace-with-openssl-rand-base64-32", "AUTH_KEYCLOAK_SECRET": "e-commerce-web-secret"}'

        - key: /ecommerce/cart-service-oauth
          value: '{"CART_SERVICE_CLIENT_SECRET": "cart-service-secret"}'

        - key: /ecommerce/order-service-oauth
          value: '{"ORDER_SERVICE_CLIENT_SECRET": "order-service-secret"}'

        - key: /ecommerce/reviews-service-oauth
          value: '{"REVIEWS_SERVICE_CLIENT_SECRET": "reviews-service-secret"}'

