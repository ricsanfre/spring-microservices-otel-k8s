apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ESO staging overlay — Fake ClusterSecretStore with inline credentials.
# Suitable for local k3d staging only.  Replace all "changeme" values before
# deploying to any shared environment.
# Combines the operator (../../base) with the staging CRs (../../config/staging).
# Use this overlay for a full local apply:
#   kubectl apply -k gitops/infrastructure/eso-stores/overlays/staging
# Flux uses base/ (via infra-operators) and config/staging/ (via infra-security) separately.
resources:
  - ../../base
  - ../../config/staging
