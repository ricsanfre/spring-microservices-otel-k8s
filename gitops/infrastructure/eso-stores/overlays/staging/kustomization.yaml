apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ESO staging overlay — Fake ClusterSecretStore with inline credentials.
# Suitable for local k3d staging only.  Replace all "changeme" values before
# deploying to any shared environment.
# ESO operator must be installed (make k8s-eso-helm) before applying.
#
# Apply:
#   kubectl apply -k gitops/infrastructure/eso-stores/overlays/staging
resources:
  - ../../base
  - cluster-secret-store.yaml
