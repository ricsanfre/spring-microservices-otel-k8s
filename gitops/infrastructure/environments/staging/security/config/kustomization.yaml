apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# security/config — Layer 2 for the security group.
# Applies the ClusterSecretStore CR that backends and monitoring use
# to resolve ExternalSecret resources.
# Requires ESO CRDs to be installed (infra-security-app healthChecks).
# Targeted by infra-security-config Flux Kustomization (dependsOn: infra-security-app).
resources:
  - ../../../../eso-stores/config/overlays/staging
