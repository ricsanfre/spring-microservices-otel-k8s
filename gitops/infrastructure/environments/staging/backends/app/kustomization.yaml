apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# backends/app — Layer 1 for the backends group.
# Installs all backend operator Helm charts:
#   - CloudNative-PG (CNPG) operator
#   - MongoDB Community operator
#   - Strimzi Kafka operator
#   - Keycloak Operator (from upstream raw manifests)
# Targeted by infra-backends-app Flux Kustomization.
resources:
  - ../../../../databases/app/overlays/staging
  - ../../../../kafka/app/overlays/staging
  - ../../../../keycloak/app/overlays/staging
