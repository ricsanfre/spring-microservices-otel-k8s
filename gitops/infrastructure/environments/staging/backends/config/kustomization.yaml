apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# backends/config — Layer 2 for the backends group.
# Applies all backend workload resources:
#   - CNPG Cluster + MongoDB Community CR + ExternalSecrets for DB credentials
#   - Strimzi Kafka cluster CR
#   - Keycloak CR + database reference + HTTPRoute + ExternalSecrets
#   - Valkey Deployment + Service (plain workload, no operator CRDs)
# Requires:
#   - Backend operator CRDs (infra-backends-app healthChecks)
#   - ESO ClusterSecretStore (infra-security-config) for ExternalSecrets
# Targeted by infra-backends-config Flux Kustomization
# (dependsOn: infra-backends-app + infra-security-config).
resources:
  - ../../../../databases/config/overlays/staging
  - ../../../../kafka/config/overlays/staging
  - ../../../../keycloak/config/overlays/staging
  # Valkey — plain Deployment + Service, no operator CRDs needed
  - ../../../../valkey/app/overlays/staging
