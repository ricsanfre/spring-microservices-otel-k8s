apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ─────────────────────────────────────────────────────────────────────────────
# Routing group aggregator — targeted by infra-routing Flux Kustomization
#
# Covers: namespaces, cert-manager (ClusterIssuer + wildcard cert),
#         Envoy Gateway (GatewayClass + Gateway + HTTPRoutes)
#
# No dependsOn required — runs in parallel with infra-security and
# infra-monitoring. Envoy Gateway TLS depends on cert-manager being ready,
# but that ordering is handled implicitly by the cert-manager cert-ready wait
# within the Gateway manifest.
# ─────────────────────────────────────────────────────────────────────────────
resources:
  # 1. Namespaces first — every component targets a specific namespace
  - ../../../namespaces
  # 2. cert-manager ClusterIssuer + wildcard cert — needed by Envoy Gateway TLS
  - ../../../cert-manager/overlays/staging
  # 3. Envoy Gateway — depends on wildcard cert
  - ../../../envoy-gateway/overlays/staging
