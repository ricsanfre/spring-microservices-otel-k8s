apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# routing/app — Layer 1 for the routing group.
# Installs cert-manager and Envoy Gateway Helm operators.
# Also creates all cluster namespaces (first group to run, no dependencies).
# Targeted by infra-routing-app Flux Kustomization.
resources:
  # Cluster namespaces — created here since routing/app has no dependsOn
  - ../../../../namespaces
  # cert-manager Helm operator (installs Certificate, ClusterIssuer, ... CRDs)
  - ../../../../cert-manager/app/overlays/staging
  # Envoy Gateway Helm operator (installs GatewayClass, Gateway, HTTPRoute, ... CRDs)
  - ../../../../envoy-gateway/app/overlays/staging
