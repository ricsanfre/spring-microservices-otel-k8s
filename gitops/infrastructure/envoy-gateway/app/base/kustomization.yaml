apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# envoy-gateway base — OCIRepository + HelmRelease for Flux Helm controller.
# envoy-gateway-values.yaml is superseded by spec.values in helmrelease.yaml.
# GatewayClass is environment-specific: it requires Gateway API CRDs installed
# by the HelmRelease above, so it lives in overlays/staging/gateway-class.yaml.
resources:
  - ocirepository.yaml
  - helmrelease.yaml
