apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  # OCIRepository must be referenced via chartRef, not spec.chart.spec.sourceRef
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Ensures the Gateway is deployed in the namespace where the resource is created.
              # rather than the default envoy-gateway-system.
              type: GatewayNamespace
        telemetry:
          metrics:
            sinks:
              - type: OpenTelemetry
                openTelemetry:
                  host: otel-collector.monitoring.svc.cluster.local
                  port: 4317
                  protocol: grpc
                  exportInterval: 60s
                  exportTimeout: 30s