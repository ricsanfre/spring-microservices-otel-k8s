# Envoy Gateway — HTTPRoutes
# External traffic entry points only. Microservices are not exposed externally;
# the Next.js BFF (frontend-service) calls them directly via cluster-internal DNS.
#
# HTTP → HTTPS redirect (applies to all hostnames on port 80)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# ── frontend-service ───────────────────────────────────────────────────────
# Next.js BFF — serves the web app and handles OIDC callbacks.
# No JWT SecurityPolicy — authentication is via browser session cookies managed by Auth.js.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-service
  namespace: e-commerce
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "app.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - name: frontend-service
          port: 3000
---
# ── Grafana ────────────────────────────────────────────────────────────────
# Routes grafana.local.test to the Grafana pod in the monitoring namespace.
# Release name 'kube-prom-stack' → service name 'kube-prom-stack-grafana'.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "grafana.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - name: kube-prom-stack-grafana
          port: 80
