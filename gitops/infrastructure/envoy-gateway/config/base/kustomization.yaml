apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Envoy Gateway config base — CRs that require Gateway API CRDs.
# GatewayClass, Gateway, HTTPRoutes, and SecurityPolicy are all environment-specific
# but share the same base definitions.
# Included by environment overlays (config/staging, config/production).
resources:
  - gateway-class.yaml
  - gateway.yaml
  - httproutes.yaml
  - security-policy.yaml
  - wildcard-certificate.yaml
