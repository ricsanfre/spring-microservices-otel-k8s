apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# envoy-gateway staging overlay — Gateway, HTTPRoutes, SecurityPolicy.
# Envoy Gateway operator must be installed before applying.
# cert-manager wildcard certificate must be ready before applying.
#
# Apply:
#   kubectl apply -k gitops/infrastructure/envoy-gateway/overlays/staging
resources:
  - ../../base
  - gateway.yaml
  - httproutes.yaml
  - security-policy.yaml
