apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# envoy-gateway base — OCIRepository + HelmRelease for Flux Helm controller.
# envoy-gateway-values.yaml is superseded by spec.values in helmrelease.yaml.
# GatewayClass is shared across all environments.
resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - gateway-class.yaml
