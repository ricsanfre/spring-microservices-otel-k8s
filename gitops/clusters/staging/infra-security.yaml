---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: keycloak
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/keycloak/app/overlays/staging
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-app
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/keycloak/config/overlays/staging
  prune: true
  wait: true
  dependsOn:
    - name: keycloak-operator-app
    - name: external-secrets-config
    - name: infra-databases-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings