apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-backends-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure/environments/staging/backends/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  # Wait for all backend operator HelmReleases and the Keycloak Operator
  # Deployment before infra-backends-config applies CRs that require their CRDs.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mongodb-operator
      namespace: mongodb
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: strimzi-kafka-operator
      namespace: kafka
    - apiVersion: apps/v1
      kind: Deployment
      name: keycloak-operator
      namespace: keycloak
