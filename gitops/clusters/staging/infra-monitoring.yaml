---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure/observability/app/overlays/staging
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  dependsOn:
    - name: external-secrets-app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure/observability/config/overlays/staging
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  dependsOn:
    - name: infra-monitoring-app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  wait: true
