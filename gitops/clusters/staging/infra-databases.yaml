---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-databases-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/databases/app/overlays/staging
  prune: true
  timeout: 10m
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-databases-config
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/databases/config/overlays/staging
  dependsOn:
    - name: infra-databases-app
    - name: external-secrets-config
  prune: true
  timeout: 10m
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-valkey-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/valkey/app/overlays/staging
  prune: true
  timeout: 10m
  wait: true
