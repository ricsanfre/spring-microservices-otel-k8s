apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-backends
    - name: infra-routing
    - name: infra-monitoring
  interval: 5m
  path: ./gitops/apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
