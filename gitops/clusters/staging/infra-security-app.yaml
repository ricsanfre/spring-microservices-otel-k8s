apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-security-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/infrastructure/environments/staging/security/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  # Wait for the ESO HelmRelease to be fully rolled out before
  # infra-security-config applies the ClusterSecretStore CR.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
