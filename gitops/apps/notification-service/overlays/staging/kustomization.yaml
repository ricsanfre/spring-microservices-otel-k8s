apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging overlay for notification-service
#
# Build & apply:
#   kubectl apply -k k8s/apps/notification-service/overlays/staging
#
# Kafka SCRAM secret — copy from the Strimzi-generated Secret in the kafka namespace:
#   kubectl get secret notification-service -n kafka -o json \
#     | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.ownerReferences)
#            | .metadata.name = "notification-service-kafka-secret"
#            | .metadata.namespace = "e-commerce"' \
#     | kubectl apply -f -
resources:
  - ../../base

images:
  - name: ghcr.io/ricsanfre/spring-microservices-otel-k8s/notification-service
    newName: ghcr.io/ricsanfre/spring-microservices-otel-k8s/notification-service
    newTag: "1.0.5"   # Renovate keeps this field current via PRs

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: notification-service
