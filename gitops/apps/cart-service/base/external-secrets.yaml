# ExternalSecrets — cart-service (e-commerce namespace)
# Provisions: cart-service-oauth-secret, cart-service-kafka-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-service-oauth-secret
  namespace: e-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: cart-service-oauth-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /ecommerce/cart-service-oauth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-service-kafka-secret
  namespace: e-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: cart-service-kafka-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /kafka/cart-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-service-valkey-secret
  namespace: e-commerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: cart-service-valkey-secret
    creationPolicy: Owner
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: /valkey/cart-service
        property: password
