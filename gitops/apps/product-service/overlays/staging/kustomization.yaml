apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging overlay for product-service
#
# Build & apply:
#   kubectl apply -k k8s/apps/product-service/overlays/staging
resources:
  - ../../base

images:
  - name: ghcr.io/ricsanfre/spring-microservices-otel-k8s/product-service
    newName: ghcr.io/ricsanfre/spring-microservices-otel-k8s/product-service
    newTag: "1.0.1"   # Renovate keeps this field current via PRs

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: product-service

# Secrets are NOT committed to git — create before applying:
#
#   kubectl create secret generic product-service-mongodb-secret \
#     --from-literal=MONGODB_URI='mongodb://products_owner:<PASS>@mongodb-svc.mongodb.svc.cluster.local:27017/products?authSource=admin&replicaSet=mongodb' \
#     --namespace e-commerce
