apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging overlay for order-service
#
# Build & apply:
#   kubectl apply -k k8s/apps/order-service/overlays/staging
resources:
  - ../../base

images:
  - name: ghcr.io/ricsanfre/spring-microservices-otel-k8s/order-service
    newName: ghcr.io/ricsanfre/spring-microservices-otel-k8s/order-service
    newTag: "1.0.1"   # Renovate keeps this field current via PRs

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: order-service

# Secrets are NOT committed to git — create before applying:
#
#   kubectl create secret generic order-service-db-secret \
#     --from-literal=password=<CHANGE_ME> \
#     --namespace e-commerce
#
#   kubectl create secret generic order-service-oauth-secret \
#     --from-literal=ORDER_SERVICE_CLIENT_SECRET=order-service-secret \
#     --namespace e-commerce
#
# Kafka SCRAM secret — copy from the Strimzi-generated Secret in the kafka namespace:
#   kubectl get secret order-service -n kafka -o json \
#     | jq 'del(.metadata.namespace,.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.ownerReferences)
#            | .metadata.name = "order-service-kafka-secret"
#            | .metadata.namespace = "e-commerce"' \
#     | kubectl apply -f -
