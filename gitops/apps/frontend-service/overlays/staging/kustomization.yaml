apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging overlay for frontend-service
#
# Prerequisites — create the secret before applying:
#   kubectl create secret generic frontend-service-secret \
#     --from-literal=AUTH_SECRET=$(openssl rand -base64 32) \
#     --from-literal=AUTH_KEYCLOAK_SECRET=e-commerce-web-secret \
#     --namespace e-commerce
#
# Build & apply:
#   kubectl apply -k k8s/apps/frontend-service/overlays/staging
resources:
  - ../../base

images:
  - name: ghcr.io/ricsanfre/spring-microservices-otel-k8s/frontend-service
    newName: ghcr.io/ricsanfre/spring-microservices-otel-k8s/frontend-service
    newTag: "1.0.1"   # Renovate keeps this field current via PRs

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend-service
