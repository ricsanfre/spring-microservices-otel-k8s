# ──────────────────────────────────────────────────────────────────────────────
# E-Commerce platform — local dev Docker Compose
#
# Profiles (use --profile <name> to activate):
#   infra           Shared databases: PostgreSQL + MongoDB + Valkey + Kafka (KRaft)
#   auth            Keycloak IAM (e-commerce realm)
#   observability   Grafana LGTM (Grafana + Prometheus + Loki + Tempo + OTel)
#
# Quick-start via Makefile (user-service example):
#   make us-infra-up    # starts: infra + auth + observability profiles
#   make us-infra-down  # stops containers (volumes preserved)
#
# Architecture note:
#   A single PostgreSQL instance hosts one database per service (users, orders, …).
#   A single MongoDB instance hosts one database per service (products, reviews, …).
#   Each service connects with its own credentials to its own database, preserving
#   the database-per-service isolation principle without spawning separate containers.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Observability stack ─────────────────────────────────────────────────────
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: [observability]
    ports:
      - "3000:3000"    # Grafana UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks: [e-commerce]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Shared databases ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: [infra]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres     # default admin DB; service DBs created by init script
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro   # runs init-databases.sh on first start
      - postgres-data:/var/lib/postgresql/data
    networks: [e-commerce]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7
    profiles: [infra]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo:/docker-entrypoint-initdb.d:ro   # seed scripts run once on first volume creation
    networks: [e-commerce]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine
    profiles: [infra]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks: [e-commerce]
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Messaging ───────────────────────────────────────────────────────────────
  # KRaft mode — no Zookeeper. Single-node dev broker.
  #
  # Listeners:
  #   APP      (SASL_PLAINTEXT, port 9092) — for microservices and host JARs.
  #            Advertised as localhost:9092 so host-side JARs can connect.
  #   INTERNAL (PLAINTEXT, port 9094)      — for kafka-init and health-check only.
  #            Only reachable inside the Docker network (no host port mapping).
  #   CONTROLLER (PLAINTEXT, port 9093)    — KRaft internal, never exposed.
  #
  # ACL authorisation (StandardAuthorizer, KRaft):
  #   allow.everyone.if.no.acl.found = false  → deny-by-default.
  #   User:ANONYMOUS is a super-user           → INTERNAL (PLAINTEXT) connections
  #   bypass ACLs, which lets kafka-init run admin commands without credentials.
  #
  # SCRAM users are created by the kafka-init service after the broker is healthy.
  kafka:
    image: apache/kafka:4.1.2
    profiles: [infra]
    ports:
      - "9092:9092"   # APP — SASL_PLAINTEXT for microservices / host JARs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Three listeners: APP (SASL), INTERNAL (PLAINTEXT), CONTROLLER (KRaft)
      KAFKA_LISTENERS: APP://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: APP://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: APP:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # SASL/SCRAM configuration for the APP listener
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # Broker-side JAAS: ScramLoginModule with no credentials (users live in KRaft metadata)
      KAFKA_OPTS: "-Djava.security.auth.login.config=/opt/kafka/config/kafka_server_jaas.conf"
      # ACL authorisation — deny by default; ANONYMOUS (INTERNAL/PLAINTEXT) is super-user
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:ANONYMOUS"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./docker/kafka/kafka_server_jaas.conf:/opt/kafka/config/kafka_server_jaas.conf:ro
    networks: [e-commerce]
    healthcheck:
      # Use the INTERNAL (PLAINTEXT) listener for health-checks — no credentials needed
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot init container: creates SCRAM users + ACLs once Kafka is healthy.
  # Connects via the INTERNAL (PLAINTEXT) listener — no credentials required.
  # Set *_KAFKA_PASSWORD env vars to override dev-default passwords.
  kafka-init:
    image: apache/kafka:4.1.2
    profiles: [infra]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-users.sh:/create-users.sh:ro
    entrypoint: ["/bin/bash", "/create-users.sh"]
    networks: [e-commerce]
    environment:
      ORDER_SERVICE_KAFKA_PASSWORD: ${ORDER_SERVICE_KAFKA_PASSWORD:-order-service-secret}
      NOTIFICATION_SERVICE_KAFKA_PASSWORD: ${NOTIFICATION_SERVICE_KAFKA_PASSWORD:-notification-service-secret}
      CART_SERVICE_KAFKA_PASSWORD: ${CART_SERVICE_KAFKA_PASSWORD:-cart-service-secret}
    restart: "no"

  # ── IAM ─────────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    profiles: [auth]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"   # exposes /health/ready on management port 9000
    ports:
      - "8180:8080"    # host port 8180 matches KEYCLOAK_URL default
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    networks: [e-commerce]
    healthcheck:
      # Keycloak 26 image is based on UBI9-micro (no curl/wget).
      # Use bash /dev/tcp to call the Quarkus management health endpoint (port 9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

# ── Networks & volumes ─────────────────────────────────────────────────────────
networks:
  e-commerce:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  valkey-data:
  kafka-data:
  keycloak-data: